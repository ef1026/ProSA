# DeepSeek configuration template.
# API keys must never be hardcoded in this repository.

api_provider: deepseek
api_key_env: DEEPSEEK_API_KEY
provider: deepseek

model_policy:
  experiment_model_family: deepseek-v3
  allowed_api_models:
    - deepseek-chat
  forbid_model_switching: true
  note: DeepSeek API uses the model id deepseek-chat for the DeepSeek-V3 chat model in this experiment. Do not use deepseek-reasoner/R1 or any other model unless the experiment design is explicitly changed.

credentials:
  api_key_env: DEEPSEEK_API_KEY
  api_key: null
  forbid_hardcoded_api_key: true

runtime:
  enabled: false
  dry_run: true
  enable_external_api: false

client:
  base_url: https://api.deepseek.com
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 2

generation:
  ownership: shared
  note: QA generation/filtering is shared and writes experiment_add/outputs/shared/qa_pairs/qa_pairs_shared.jsonl.
  model_family: deepseek-v3
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 2048
  candidates_per_page: 20
  fallback_candidates_per_zero_qa_page: 10
  batch_by_page: true
  cache_enabled: true
  prompt_version: v2
  input_clean_parse_root: experiment_add/outputs/shared/clean_parse
  output_candidates_raw: experiment_add/outputs/shared/qa_pairs/qa_candidates_raw.jsonl
  output_pairs_shared: experiment_add/outputs/shared/qa_pairs/qa_pairs_shared.jsonl

answering:
  ownership: exp1_qa
  model_family: deepseek-v3
  model: deepseek-chat
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  batch_by_page: true
  cache_enabled: true
  qa_answering_prompt_version: v2
  input_qa_pairs: experiment_add/outputs/shared/qa_pairs/qa_pairs_shared.jsonl
  output_qa_runs_root: experiment_add/outputs/exp1_qa/qa_runs

logging:
  log_requests: false
  log_responses: false
  redact_secrets: true
  shared_log_file: experiment_add/logs/shared/deepseek_generation.log
  exp1_log_file: experiment_add/logs/exp1_qa/deepseek_answering.log
